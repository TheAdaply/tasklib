[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasklib"
version = "0.1.0"
description = "A tiny, dependency-free task manager core library and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["tasks", "todo", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tasklib = "tasklib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tasklib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
